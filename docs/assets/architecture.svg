<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="ar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141D"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37D880"/>
    </marker>
  </defs>
  <rect width="1200" height="320" fill="url(#ar-bg)"/>

  <!-- GitHub -->
  <g transform="translate(40, 118)">
    <rect width="220" height="84" rx="18" fill="#12161F" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#F3F5F8">GitHub GraphQL</text>
    <text x="20" y="54" font-size="11" fill="#9399A0">contributionsCollection</text>
    <text x="20" y="68" font-size="11" fill="#9399A0">Personal Access Token</text>
  </g>
  <line x1="260" y1="160" x2="326" y2="160" stroke="#37D880" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Android app core -->
  <g transform="translate(330, 60)">
    <rect width="260" height="200" rx="20" fill="#12161F" stroke="#37D880" stroke-opacity="0.35"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#F3F5F8">Commit Pulse (Kotlin)</text>

    <rect x="20" y="52" width="220" height="36" rx="10" fill="#161B24"/>
    <text x="32" y="75" font-size="12" fill="#E5E8EB">GitHubRepository · Retrofit</text>

    <rect x="20" y="96" width="220" height="36" rx="10" fill="#161B24"/>
    <text x="32" y="119" font-size="12" fill="#E5E8EB">SettingsRepository · DataStore</text>

    <rect x="20" y="140" width="220" height="36" rx="10" fill="#161B24"/>
    <text x="32" y="163" font-size="12" fill="#E5E8EB">WorkManager · powiadomienia</text>
  </g>

  <line x1="590" y1="120" x2="656" y2="90" stroke="#37D880" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="200" x2="656" y2="230" stroke="#37D880" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Glance widget -->
  <g transform="translate(660, 24)">
    <rect width="230" height="110" rx="18" fill="#12161F" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#F3F5F8">Widget 2×1 · Jetpack Glance</text>
    <text x="20" y="54" font-size="11" fill="#9399A0">5 trybów: heatmapa, sparkline,</text>
    <text x="20" y="70" font-size="11" fill="#9399A0">licznik, cel, heatmapa 30d</text>
    <text x="20" y="90" font-size="11" fill="#37D880">RemoteViews · AppWidgetProvider</text>
  </g>

  <!-- Compose app -->
  <g transform="translate(660, 154)">
    <rect width="230" height="110" rx="18" fill="#12161F" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#F3F5F8">Aplikacja · Jetpack Compose</text>
    <text x="20" y="54" font-size="11" fill="#9399A0">Podgląd · Personalizacja</text>
    <text x="20" y="70" font-size="11" fill="#9399A0">Powiadomienia · Konto</text>
    <text x="20" y="90" font-size="11" fill="#37D880">Material 3 · MVVM</text>
  </g>

  <!-- Web mockup origin, dashed to show lineage -->
  <g transform="translate(930, 118)">
    <rect width="230" height="84" rx="18" fill="none" stroke="#5B6270" stroke-dasharray="4 4"/>
    <text x="20" y="34" font-size="14" font-weight="700" fill="#9399A0">Web makieta</text>
    <text x="20" y="54" font-size="11" fill="#5B6270">TanStack Start + React</text>
    <text x="20" y="68" font-size="11" fill="#5B6270">design tokens oklch</text>
  </g>
  <line x1="895" y1="160" x2="924" y2="160" stroke="#5B6270" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="1045" y="222" font-size="10" fill="#5B6270" text-anchor="middle">źródło designu</text>
</svg>
