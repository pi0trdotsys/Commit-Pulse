<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141D"/>
      <stop offset="55%" stop-color="#080B10"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37D880" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#37D880" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#154470" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#154470" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="chipStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37D880" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#37D880" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect x="-120" y="-140" width="600" height="600" fill="url(#glowBlue)"/>
  <rect x="760" y="-80" width="620" height="560" fill="url(#glowGreen)"/>

  <!-- wordmark -->
  <g transform="translate(72, 118)">
    <rect x="0" y="-34" width="14" height="14" rx="4" fill="#1D6442"/>
    <rect x="20" y="-34" width="14" height="14" rx="4" fill="#0EC073"/>
    <rect x="0" y="-16" width="14" height="14" rx="4" fill="#0EC073"/>
    <rect x="20" y="-16" width="14" height="14" rx="4" fill="#4FED8A"/>

    <text x="52" y="0" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#F3F5F8">Commit Pulse</text>
  </g>

  <g transform="translate(72, 170)">
    <text x="0" y="0" font-size="19" fill="#9399A0" letter-spacing="0.2">
      Twoja aktywność programistyczna, jako widget 2×1 na ekranie głównym.
    </text>
    <text x="0" y="32" font-size="14" fill="#5B6270" letter-spacing="2.5">
      TANSTACK START · KOTLIN · JETPACK GLANCE · GITHUB GRAPHQL
    </text>
  </g>

  <g transform="translate(72, 250)">
    <rect x="0" y="0" width="168" height="40" rx="20" fill="none" stroke="url(#chipStroke)" stroke-width="1.5"/>
    <text x="84" y="26" font-size="14" font-weight="700" fill="#4FED8A" text-anchor="middle" letter-spacing="0.5">WEB MAKIETA</text>
    <rect x="188" y="0" width="168" height="40" rx="20" fill="none" stroke="#2E3542" stroke-width="1.5"/>
    <text x="272" y="26" font-size="14" font-weight="700" fill="#E5E8EB" text-anchor="middle" letter-spacing="0.5">NATYWNY ANDROID</text>
  </g>

  <!-- widget mock -->
  <g transform="translate(792, 78)">
    <rect x="-18" y="-18" width="366" height="206" rx="26" fill="#0B0F16" stroke="#1E2430" stroke-width="1"/>
    <rect x="0" y="0" width="330" height="170" rx="20" fill="#1B1F27" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <text x="24" y="66" font-size="58" font-weight="800" fill="#F3F5F8" letter-spacing="-1">12</text>
    <text x="98" y="66" font-size="15" fill="#9399A0" letter-spacing="1.5">DZIŚ</text>

    <g transform="translate(232, 28)">
