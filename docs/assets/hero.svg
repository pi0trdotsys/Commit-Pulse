      <text x="38" y="20" font-size="14" font-weight="700" fill="#37D880" text-anchor="middle">🔥 7d</text>
    </g>

    <g transform="translate(24, 90)" font-size="15" font-weight="700">
      <text x="0" y="0" fill="#37D880">▲ +18%</text>
