    </g>

    <g transform="translate(24, 118)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#202C25"/>
      <rect x="24" y="0" width="18" height="18" rx="4" fill="#1D6442"/>
      <rect x="48" y="0" width="18" height="18" rx="4" fill="#1D6442"/>
      <rect x="72" y="0" width="18" height="18" rx="4" fill="#1B915A"/>
      <rect x="96" y="0" width="18" height="18" rx="4" fill="#0EC073"/>
      <rect x="120" y="0" width="18" height="18" rx="4" fill="#1B915A"/>
      <rect x="144" y="0" width="18" height="18" rx="4" fill="#4FED8A"/>
      <rect x="168" y="0" width="18" height="18" rx="4" fill="#0EC073"/>
      <rect x="192" y="0" width="18" height="18" rx="4" fill="#1D6442"/>
      <rect x="216" y="0" width="18" height="18" rx="4" fill="#1B915A"/>
      <rect x="240" y="0" width="18" height="18" rx="4" fill="#0EC073"/>
      <rect x="264" y="0" width="18" height="18" rx="4" fill="#4FED8A"/>
      <rect x="288" y="0" width="18" height="18" rx="4" fill="#4FED8A"/>
    </g>

    <text x="0" y="-30" font-size="13" fill="#5B6270" letter-spacing="2">WIDGET 2×1</text>
