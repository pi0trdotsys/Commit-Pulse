<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141D"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <pattern id="wm-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="url(#wm-bg)"/>
  <rect width="1200" height="280" fill="url(#wm-grid)"/>

  <!-- card 1: Heatmapa + liczba -->
  <g transform="translate(32, 24)">
    <rect width="208" height="176" rx="20" fill="#1B1F27" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(18, 20)">
      <text x="0" y="42" font-size="38" font-weight="800" fill="#F3F5F8">12</text>
      <text x="46" y="42" font-size="11" fill="#9399A0" letter-spacing="1">DZIŚ</text>
      <rect x="128" y="6" width="44" height="22" rx="11" fill="#37D880" fill-opacity="0.16"/>
      <text x="150" y="21" font-size="11" font-weight="700" fill="#37D880" text-anchor="middle">🔥7d</text>
      <g transform="translate(0, 60)" font-size="12" font-weight="700">
        <text fill="#37D880">▲ +18%</text>
      </g>
      <g transform="translate(0, 86)">
        <rect x="0" y="0" width="13" height="13" rx="3" fill="#202C25"/>
        <rect x="17" y="0" width="13" height="13" rx="3" fill="#1D6442"/>
        <rect x="34" y="0" width="13" height="13" rx="3" fill="#1B915A"/>
        <rect x="51" y="0" width="13" height="13" rx="3" fill="#0EC073"/>
        <rect x="68" y="0" width="13" height="13" rx="3" fill="#1B915A"/>
        <rect x="85" y="0" width="13" height="13" rx="3" fill="#4FED8A"/>
        <rect x="102" y="0" width="13" height="13" rx="3" fill="#0EC073"/>
        <rect x="119" y="0" width="13" height="13" rx="3" fill="#1D6442"/>
        <rect x="136" y="0" width="13" height="13" rx="3" fill="#1B915A"/>
        <rect x="153" y="0" width="13" height="13" rx="3" fill="#4FED8A"/>
      </g>
    </g>
    <text x="104" y="204" font-size="13" fill="#9399A0" text-anchor="middle">Heatmapa + liczba</text>
  </g>

  <!-- card 2: Sparkline -->
  <g transform="translate(264, 24)">
    <rect width="208" height="176" rx="20" fill="#1B1F27" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(18, 20)">
      <text x="0" y="42" font-size="34" font-weight="800" fill="#F3F5F8">9</text>
      <text x="34" y="42" font-size="11" fill="#9399A0" letter-spacing="1">DZIŚ</text>
      <text x="128" y="26" font-size="12" font-weight="700" fill="#37D880">▲ +6%</text>
      <path d="M 0 100 L 18 92 L 36 96 L 54 76 L 72 82 L 90 58 L 108 66 L 126 40 L 144 52 L 162 30 L 172 34"
            fill="none" stroke="#37D880" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 0 100 L 18 92 L 36 96 L 54 76 L 72 82 L 90 58 L 108 66 L 126 40 L 144 52 L 162 30 L 172 34 L 172 110 L 0 110 Z"
            fill="#37D880" fill-opacity="0.12"/>
      <circle cx="172" cy="34" r="3.5" fill="#37D880"/>
    </g>
    <text x="104" y="204" font-size="13" fill="#9399A0" text-anchor="middle">Sparkline</text>
  </g>

  <!-- card 3: Licznik -->
  <g transform="translate(496, 24)">
    <rect width="208" height="176" rx="20" fill="#1B1F27" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(18, 70)">
      <text x="0" y="0" font-size="56" font-weight="800" fill="#F3F5F8">6</text>
      <text x="46" y="-16" font-size="11" fill="#9399A0" letter-spacing="0.5">commitów</text>
      <text x="46" y="0" font-size="11" fill="#9399A0" letter-spacing="0.5">dzisiaj</text>
      <text x="0" y="34" font-size="13" font-weight="700" fill="#F75D59">▼ -4%</text>
    </g>
    <text x="104" y="204" font-size="13" fill="#9399A0" text-anchor="middle">Licznik</text>
  </g>

  <!-- card 4: Pierścień celu -->
  <g transform="translate(728, 24)">
    <rect width="208" height="176" rx="20" fill="#1B1F27" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(24, 32)">
      <circle cx="36" cy="36" r="30" fill="none" stroke="#3A4150" stroke-width="7"/>
      <circle cx="36" cy="36" r="30" fill="none" stroke="#37D880" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="141 189" transform="rotate(-90 36 36)"/>
      <text x="36" y="42" font-size="20" font-weight="800" fill="#F3F5F8" text-anchor="middle">6</text>
      <g transform="translate(88, 8)">
        <text x="0" y="14" font-size="13" font-weight="700" fill="#F3F5F8">cel 8/dzień</text>
        <text x="0" y="38" font-size="12" font-weight="700" fill="#37D880">▲ +12%</text>
        <text x="0" y="60" font-size="11" fill="#9399A0">🔥 seria 7 dni</text>
      </g>
    </g>
    <text x="104" y="204" font-size="13" fill="#9399A0" text-anchor="middle">Pierścień celu</text>
  </g>

  <!-- card 5: Heatmapa 30 dni -->
  <g transform="translate(960, 24)">
    <rect width="208" height="176" rx="20" fill="#1B1F27" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(18, 24)">
      <text x="0" y="10" font-size="11" fill="#9399A0" letter-spacing="1.5">30 DNI</text>
      <text x="172" y="10" font-size="12" font-weight="700" fill="#37D880" text-anchor="end">▲ +18%</text>
      <g transform="translate(0, 26)">
        <!-- 3 rows x 10 cols compact heatmap -->
        <g id="row1">
          <rect x="0" y="0" width="15" height="15" rx="3" fill="#202C25"/><rect x="18" y="0" width="15" height="15" rx="3" fill="#1D6442"/><rect x="36" y="0" width="15" height="15" rx="3" fill="#1B915A"/><rect x="54" y="0" width="15" height="15" rx="3" fill="#0EC073"/><rect x="72" y="0" width="15" height="15" rx="3" fill="#4FED8A"/><rect x="90" y="0" width="15" height="15" rx="3" fill="#1B915A"/><rect x="108" y="0" width="15" height="15" rx="3" fill="#1D6442"/><rect x="126" y="0" width="15" height="15" rx="3" fill="#0EC073"/><rect x="144" y="0" width="15" height="15" rx="3" fill="#4FED8A"/><rect x="162" y="0" width="15" height="15" rx="3" fill="#1B915A"/>
        </g>
        <g transform="translate(0,20)">
          <rect x="0" y="0" width="15" height="15" rx="3" fill="#1D6442"/><rect x="18" y="0" width="15" height="15" rx="3" fill="#0EC073"/><rect x="36" y="0" width="15" height="15" rx="3" fill="#202C25"/><rect x="54" y="0" width="15" height="15" rx="3" fill="#4FED8A"/><rect x="72" y="0" width="15" height="15" rx="3" fill="#1B915A"/><rect x="90" y="0" width="15" height="15" rx="3" fill="#0EC073"/><rect x="108" y="0" width="15" height="15" rx="3" fill="#4FED8A"/><rect x="126" y="0" width="15" height="15" rx="3" fill="#1D6442"/><rect x="144" y="0" width="15" height="15" rx="3" fill="#1B915A"/><rect x="162" y="0" width="15" height="15" rx="3" fill="#0EC073"/>
        </g>
        <g transform="translate(0,40)">
          <rect x="0" y="0" width="15" height="15" rx="3" fill="#0EC073"/><rect x="18" y="0" width="15" height="15" rx="3" fill="#4FED8A"/><rect x="36" y="0" width="15" height="15" rx="3" fill="#1B915A"/><rect x="54" y="0" width="15" height="15" rx="3" fill="#202C25"/><rect x="72" y="0" width="15" height="15" rx="3" fill="#0EC073"/><rect x="90" y="0" width="15" height="15" rx="3" fill="#4FED8A"/><rect x="108" y="0" width="15" height="15" rx="3" fill="#1B915A"/><rect x="126" y="0" width="15" height="15" rx="3" fill="#0EC073"/><rect x="144" y="0" width="15" height="15" rx="3" fill="#4FED8A"/><rect x="162" y="0" width="15" height="15" rx="3" fill="#1D6442"/>
        </g>
      </g>
    </g>
    <text x="104" y="204" font-size="13" fill="#9399A0" text-anchor="middle">Heatmapa 30 dni</text>
  </g>
</svg>
